name: Node host build check

# Builds and starts the app the way Hostinger does: Linux, Node 22,
# production-only install, `npm run build`, then `npm start`.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node -v && npm -v
      - name: Install (production only)
        run: npm ci --omit=dev
        env:
          NODE_ENV: production
      - name: Build and measure memory
        run: /usr/bin/time -v npm run build 2>&1 | tee build.log; grep -E "Maximum resident|Exit status" build.log
        env:
          NODE_ENV: production
      - name: Build with a 1 GB memory cap
        run: rm -rf .next && NODE_OPTIONS=--max-old-space-size=1024 npm run build
        env:
          NODE_ENV: production
      - name: Start and request pages
        run: |
          PORT=3000 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          for u in / /products/ /products/pride-hair-clay/ /admin/ /item/ /wishlist/ /help/ /cart/ /checkout/ /orders/; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000$u) $u"
          done
          cat server.log
