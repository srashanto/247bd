name: Keep Supabase awake

# Supabase pauses free projects after a week without requests.
# This pings both stores once a day so neither gets paused.
on:
  schedule:
    - cron: "17 3 * * *" # every day at 09:17 Bangladesh time
  workflow_dispatch:

permissions:
  actions: write # lets the last step keep this schedule switched on

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping 247bd.net database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://jwtgupedqsjyzjseeorw.supabase.co/rest/v1/settings?select=id&limit=1" \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}")
          echo "247bd.net: HTTP $code"
          [ "$code" = "200" ]
        env:
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3dGd1cGVkcXNqeXpqc2Vlb3J3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NDI3MjksImV4cCI6MjEwODUxODcyOX0.ILgbN-4dtNV-ZyepO8suOGMJzhzzwf2vE-ML4GEkeSg

      - name: Ping 18bd.shop database
        if: always()
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://jhmxciqjivneobyjbcvh.supabase.co/rest/v1/app_settings?select=*&limit=1" \
            -H "apikey: ${KEY}")
          echo "18bd.shop: HTTP $code"
          [ "$code" = "200" ]
        env:
          KEY: sb_publishable_X7IL3v4n8R0NsW12NHfaOg_7Wngs33v

      # GitHub turns off scheduled workflows in repos with no activity for 60 days.
      # Re-enabling it every run keeps the daily ping going.
      - name: Keep this schedule enabled
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
